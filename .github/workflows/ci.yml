# PR checks: host unit tests. Arduino compile can be enabled once arduino-cli is cached in CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File firmware/test/run_host_tests.ps1

